<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find movies, explore details, and build your personal watchlist."
    />

    <title>Find Your Film</title>

    <!-- GOOGLE Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="main.js" type="module" defer></script>
  </head>

  <body>
    <!-- Header -->
    <header class="site-header">
      <div class="hero">
        <h1 class="hero-title">Find your film</h1>

        <nav class="hero-navigation" aria-label="Main navigation">
          <a href="./pages/watchlist.html" class="hero-watchlist--link">
            My Watchlist
          </a>
        </nav>
      </div>
    </header>

    <!-- Main -->
    <main class="main-content">
      <!-- Movie Search -->
      <section class="search-section" aria-label="Search movies">
        <div class="container">
          <form class="search-form" id="search-form">
            <label for="movie-search" class="sr-only">
              Search for a movie
            </label>
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input
              type="search"
              id="movie-search"
              name="movie"
              class="search-form--input"
              placeholder="Search for a movie..."
              autocomplete="off"
              required
            />
            <button
              type="button"
              id="clearSearch"
              class="clear-btn"
              aria-label="Clear search"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.61 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>

            <button type="submit" class="search-form--button">Search</button>
          </form>
        </div>
      </section>

      <!-- Movie Search Results -->
      <section class="movie-results" aria-label="Movie search results">
        <!-- JavaScript will dynamically populate this list -->
        <ul
          class="movie-list container"
          id="movie-list"
          aria-live="polite"
        ></ul>

        <!-- Loading State  -->
        <div id="loading" class="loading">
          <h1>Searching for your movie</h1>
          <div class="loader"></div>
        </div>

        <!-- Movie not found State  -->
        <div class="not-found-state" id="not-found-state">
          <p>
            Unable to find what you’re looking for. Please try another search.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
